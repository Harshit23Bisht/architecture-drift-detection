name: Architecture Drift CI Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  architecture-check:
    name: Run Architecture Drift Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Architecture Drift Scanner (Project Scan)
        run: |
          python -m engine.cli scan --repo . --rules architecture_rules.yaml --fail-on HIGH

      - name: Verify Architecture Gate Regression Test (sample_repo)
        run: |
          if python -m engine.cli scan --repo sample_repo --rules sample_repo/architecture_rules.yaml --fail-on HIGH; then
            echo "Expected architecture scanner to fail on sample_repo, but it passed!"
            exit 1
          else
            echo "Architecture scanner correctly caught intentional violation in sample_repo (exit code 1)."
          fi

      - name: Run Test Suite
        run: |
          pytest -v
